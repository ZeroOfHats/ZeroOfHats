# A generic Alembic configuration file.
# https://alembic.sqlalchemy.org/en/latest/startup.html

[alembic]
# path to migration scripts
script_location = migrations

# template for new migration scripts
# file_template = %%(rev)s_%%(slug)s

# timezone for new migration scripts
# timezone = UTC

# sqlalchemy.url = driver://user:pass@localhost/dbname
# The DATABASE_URL will be set from env.py using the Settings from config.py
sqlalchemy.url = postgresql+asyncpg://user:password@postgres/appdb

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
