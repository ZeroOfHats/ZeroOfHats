version: '3.8'

services:
  postgres:
    build: ./docker/postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://user:password@postgres/appdb"
    volumes:
      - ./src:/app # Mount src directory for live reload with uvicorn
    depends_on:
      - postgres

volumes:
  postgres_data:
