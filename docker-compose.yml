version: '3.8'

services:
  ollama:
    build:
      context: .
      dockerfile: config/ollama.Dockerfile
    container_name: baby_zero_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    tty: true
    restart: unless-stopped
    # Add GPU support if available and configured
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1 # or 'all'
    #           capabilities: [gpu]

  chromadb:
    build:
      context: .
      dockerfile: config/chromadb.Dockerfile
    container_name: baby_zero_chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma_data
    restart: unless-stopped

volumes:
  ollama_data:
  chromadb_data:
